name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 注入默认 AI 配置（key 来自仓库 Secrets，不进源码）
        run: |
          cat > app/src/main/res/values/defaults.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_base_url" translatable="false">${DEFAULT_BASE_URL}</string>
              <string name="default_api_key" translatable="false">${DEFAULT_API_KEY}</string>
              <string name="default_model" translatable="false">${DEFAULT_MODEL:-gpt-4o-mini}</string>
          </resources>
          EOF
        env:
          DEFAULT_BASE_URL: https://open.124678.xyz/v1
          DEFAULT_API_KEY: ${{ secrets.DEFAULT_API_KEY }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL }}

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 构建次数 ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
